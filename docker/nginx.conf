pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { audio/ogg opus; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location /api/ {
            client_max_body_size 10m; # Match the API's 10 MiB account limit.
            proxy_pass http://api:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
        }
        location = /_account_auth {
            internal;
            proxy_pass http://api:3001/api/session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }
        location ~ ^/(data|audio|story-images|textbook-pages)/ {
            auth_request /_account_auth;
            try_files $uri =404;
            add_header Cache-Control "private, no-store" always;
        }
        location / {
            try_files $uri $uri/index.html =404;
        }
        location /_next/static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
